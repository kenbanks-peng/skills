# These CLI modules live in scripts, not in the enclosing dispatch directory.
# Keep import classification stable from both the repository and skill roots.
src = ["scripts"]

# Keep the required baseline stable across Ruff releases (including import order).
[lint]
select = ["E4", "E7", "E9", "F", "I"]

# The public command disables bytecode before importing lifecycle modules.
[lint.per-file-ignores]
"scripts/dispatch.py" = ["E402"]
